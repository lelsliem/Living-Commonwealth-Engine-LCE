# The Sample Host's tuning — the modder's knob, demonstrated.
# Drop this file next to the executable and edit; the host reads it.
# Unknown keys (host.*) ride along and are ignored by the core.

sim.memory.fade = 0.08        ; a 1.0-weight fact fades below the forget
                              ; threshold in ~11 ticks — the market door
                              ; closes at 20:00 and fades open by 08:00
sim.drift.rate = 0.001        ; feelings drift slowly
sim.goal.urgency = 0.05       ; goals grow with patience
sim.trust.gain = 0.15         ; a fair trade proves reliable
sim.jitter = 0.15             ; no two minds alike
host.hunger.decay = 0.025     ; the host's own keys — the core ignores them
host.fatigue.decay = 0.01
host.social.decay = 0.01
host.meal.food = 0.90
