#===============================================================================
#
#  Living Commonwealth Engine (LCE)
#  Building living worlds through simulation.
#
#  SPDX-License-Identifier: MIT
#
#  0.9.1 — Dependabot. Two ecosystems are trackable:
#
#    * github-actions — keeps every action in .github/workflows on its
#      current major (checkout, codeql, the Pages actions, ...), so the
#      workflows never drift onto deprecated Node runtimes or yanked tags.
#    * docker — the dev-loop image (Dockerfile) tracks its base image;
#      a fresh ubuntu LTS bump arrives as a PR instead of a surprise.
#
#  The one pinned dependency Dependabot CANNOT track is spdlog
#  (v1.17.0, fetched via FetchContent in CMakeLists.txt) — there is no
#  C++ package ecosystem, and the pin is deliberate: the freeze locks
#  the compiler surface we build against. Bump it by hand, and the
#  four-toolchain matrix proves the tree before it lands.
#
#===============================================================================
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "CI: "
    labels:
      - "ci"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "Dev: "
    labels:
      - "dev-loop"
