#===============================================================================
#
#  Living Commonwealth Engine (LCE)
#  Building living worlds through simulation.
#
#  SPDX-License-Identifier: MIT
#
#  0.8.6 — CI. Build + all suites on three toolchains, every push.
#
#  The freeze (SurfaceTest) is the point: a drifted API must fail on
#  EVERY compiler, and the size guards on the ABI-stable co-save
#  structs must hold cross-compiler — one toolchain accepting the code
#  is not the contract until all three do. MSVC runs /W4 /WX (warnings
#  are errors); GCC and Clang verify portability on the same suites.
#
#  The doctor and bench tools build too (LCE_BUILD_TOOLS=ON), and the
#  bench's --sanity mode smoke-runs after the suites — the Scale
#  numbers are the 0.9.0 gate, so they must at least RUN on every
#  toolchain even though their timing is machine-dependent.
#
#  The GCC leg used to fail on Linux where Clang and MSVC passed:
#  GCC 13+ promotes -Wchanges-meaning to an error, and the frozen
#  API names members after their types (IntentProducedEvent::Intent,
#  OutcomeRecordedEvent::Outcome). CMakeLists silences that
#  diagnostic on GCC; the compiler version is printed so the log
#  says exactly what ran.
#
#===============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-msvc
            os: windows-latest
          - name: ubuntu-gcc
            os: ubuntu-latest
          - name: ubuntu-clang
            os: ubuntu-latest
            cxx: clang++
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then
            export CXX="${{ matrix.cxx }}"
            echo "CXX: $CXX"
            "$CXX" --version | head -1
          fi
          cmake -S . -B Build \
            -DLCE_BUILD_TESTS=ON \
            -DLCE_BUILD_SAMPLES=ON \
            -DLCE_BUILD_TOOLS=ON

      # The log is kept and, on failure, the error lines are re-emitted
      # as ::error:: workflow annotations — the same text the step log
      # shows, but readable from the Checks API so a build break is
      # diagnosable without signing in.
      - name: Build
        shell: bash
        run: |
          if ! cmake --build Build --config Debug --parallel 2>&1 | tee build.log; then
            echo "::group::last errors"
            grep -aiE 'error:|fatal error|undefined reference|internal compiler' build.log | tail -20 | sed 's/^/::error::/' || true
            echo "::endgroup::"
            exit 1
          fi

      - name: Test (all suites)
        shell: bash
        run: ctest --test-dir Build -C Debug --output-on-failure

      # The tools live in Build/Bin on single-config generators (Linux)
      # and Build/Bin/<config> on multi-config (MSVC) — find them. The
      # name carries the platform's executable suffix (LCE.Bench vs
      # LCE.Bench.exe), so match both and fail loudly rather than let
      # an empty path become a cryptic "command not found".
      - name: Tool smokes (bench sanity, studio selftest)
        shell: bash
        run: |
          BENCH=$(find Build/Bin \( -name 'LCE.Bench' -o -name 'LCE.Bench.exe' \) -type f | head -1)
          if [ -z "$BENCH" ]; then
            echo "FAIL — LCE.Bench not found under Build/Bin"; find Build/Bin | head -20; exit 1
          fi
          echo "bench: $BENCH"
          "$BENCH" --sanity
          STUDIO=$(find Build/Bin \( -name 'LCE.Studio' -o -name 'LCE.Studio.exe' \) -type f | head -1)
          if [ -z "$STUDIO" ]; then
            echo "FAIL — LCE.Studio not found under Build/Bin"; find Build/Bin | head -20; exit 1
          fi
          echo "studio: $STUDIO"
          "$STUDIO" --selftest

  # 0.8.8 — the packaging gate: both Embedding paths, proven end to end
  # (FetchContent via the doctor scaffold, find_package against the
  # installed prefix). A generated project that compiles and runs IS the
  # proof the recipe is real.
  packaging-gate:
    name: packaging-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run the packaging gate
        shell: bash
        run: bash Tools/scripts/consumer-test.sh "$PWD"
