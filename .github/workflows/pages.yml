#===============================================================================
#
#  Living Commonwealth Engine (LCE)
#  Building living worlds through simulation.
#
#  SPDX-License-Identifier: MIT
#
#  0.9.1 — the docs site. GitHub Pages renders the tree's markdown —
#  README, the LearningPath, the design and decision documents, the
#  SDK recipe — through Jekyll. _config.yml applies a layout to every
#  page and jekyll-relative-links keeps the repo's own relative .md
#  links working on the site. The code folders are excluded: the site
#  is the docs, not the source.
#
#  One-time setup: Settings → Pages → Source: "GitHub Actions".
#  Until then the build succeeds and the deploy step reports the
#  page is not enabled.
#
#===============================================================================
name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v3

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
