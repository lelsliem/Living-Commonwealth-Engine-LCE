#===============================================================================
#
#  Living Commonwealth Engine (LCE)
#  Building living worlds through simulation.
#
#  SPDX-License-Identifier: MIT
#
#  0.9.1 — the docs site. GitHub Pages renders the tree's markdown —
#  README, the LearningPath, the design and decision documents, the
#  SDK recipe — through Jekyll. _config.yml applies a layout to every
#  page and jekyll-relative-links keeps the repo's own relative .md
#  links working on the site. The code folders are excluded: the site
#  is the docs, not the source.
#
#  One-time setup (manual, one click): Settings → Pages → Source:
#  "GitHub Actions". Until then configure-pages reports the site is
#  not enabled and the workflow stays red; a workflow token cannot
#  enable Pages itself (configure-pages' enablement input requires a
#  token other than GITHUB_TOKEN).
#
#===============================================================================
name: Docs (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v6
      - uses: actions/jekyll-build-pages@v1
      - uses: actions/upload-pages-artifact@v5

  deploy:
    name: deploy
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
